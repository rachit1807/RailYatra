services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: railyatra
      POSTGRES_USER: railyatra
      POSTGRES_PASSWORD: railyatra_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - railyatra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railyatra -d railyatra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  railyatra-postgres:
